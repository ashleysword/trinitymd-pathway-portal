# Keep the tag in sync with CLINIC_TAG (default "clinics").
query CartInput {
  cart {
    buyerIdentity {
      customer {
        hasAnyTag(tags: ["clinics"])
      }
    }
    cost {
      subtotalAmount {
        currencyCode
      }
    }
    lines {
      id
      quantity
      cost {
        amountPerQuantity {
          amount
        }
      }
      merchandise {
        ... on ProductVariant {
          product {
            id
          }
        }
      }
    }
  }
  discount {
    discountClasses
    metafield(namespace: "$app:clinic-wholesale", key: "pricing-config") {
      jsonValue
    }
  }
}
