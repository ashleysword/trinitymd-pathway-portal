api_version = "2026-07"

[[extensions]]
name = "Clinic wholesale pricing"
handle = "clinic-wholesale-pricing"
type = "function"
description = "INACTIVE (store is on Basic; custom-app Functions need Plus). Wholesale unit prices by quantity for customers tagged clinics."

  [[extensions.targeting]]
  target = "cart.lines.discounts.generate.run"
  input_query = "src/cart_lines_discounts_generate_run.graphql"
